<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alma — Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; background: #000000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .home-container { text-align: center; width: 100%; max-width: 600px; padding: 20px; }
    .alma-logo { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; color: #ffffff; }
    .alma-subtitle { font-size: 14px; color: #8e8e93; margin-bottom: 40px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 32px; }
    .search-input { flex: 1; height: 44px; padding: 0 16px; border: 1px solid #38383a; border-radius: 22px; background: #1c1c1e; color: #f5f5f7; font-size: 15px; outline: none; }
    .search-input:focus { border-color: #0a84ff; outline: 2px solid #0a84ff; }
    .search-btn { height: 44px; padding: 0 20px; border: 1px solid #38383a; border-radius: 22px; background: #1c1c1e; color: #f5f5f7; font-size: 14px; cursor: pointer; }
    .search-btn:hover { background: #2c2c2e; }
    .quick-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
    .quick-link { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid #38383a; border-radius: 16px; background: #1c1c1e; color: #f5f5f7; text-decoration: none; font-size: 14px; }
    .quick-link:hover { background: #2c2c2e; border-color: #0a84ff; }
    .quick-link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; }
  </style>
</head>
<body>
  <div class="home-container">
    <div class="alma-logo">Alma</div>
    <div class="alma-subtitle">Your personal browser</div>

    <div class="search-box">
      <input type="text" id="home-search" placeholder="Search or type a URL..." spellcheck="false" />
      <button id="home-go">Go</button>
    </div>

        GitHub
      </a>
    </div>
  </div>

  <script>
    const input = document.getElementById("home-search");
    const goBtn = document.getElementById("home-go");

    function go() {
      const val = input.value.trim();
      if (!val) return;
      const url = /^https?:\/\//i.test(val) ? val : (val.includes(".") && !val.includes(" ") ? "https://" + val : "https://www.google.com/search?q=" + encodeURIComponent(val));
      window.location.href = url;
    }

    goBtn.addEventListener("click", go);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
  </script>
</body>
</html>
