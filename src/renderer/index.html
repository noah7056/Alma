<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; child-src 'self' https:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alma</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="title-bar" id="title-bar">
    <div class="title-bar-app">
      <img class="title-bar-icon" src="assets/icons/alma.svg" alt="Alma" />
    </div>
  </div>

  <div class="tab-strip" id="tab-strip">
    <div class="tabs" id="tabs">
      <button id="new-tab" class="new-tab" aria-label="New tab">+</button>
    </div>
    <button id="split-view" class="new-tab" aria-label="Split view"><img class="nav-icon" src="assets/icons/split.svg" alt="Split" /></button>
    <button id="settings-btn" class="new-tab" aria-label="Settings"><img class="nav-icon" src="assets/icons/settings.svg" alt="Settings" /></button>
  </div>

  <header class="toolbar">
    <div class="nav-group">
      <button id="back" aria-label="Back"><img class="nav-icon" src="assets/icons/back.svg" alt="Back" /></button>
      <button id="forward" aria-label="Forward"><img class="nav-icon" src="assets/icons/forward.svg" alt="Forward" /></button>
      <button id="reload" aria-label="Reload"><img class="nav-icon" src="assets/icons/reload.svg" alt="Reload" /></button>
      <button id="home" aria-label="Home"><img class="nav-icon" src="assets/icons/home.svg" alt="Home" /></button>
    </div>
    <div class="address-group">
      <input type="url" id="address" placeholder="Search or type a URL..." spellcheck="false" />
      <button id="go" aria-label="Go"><img class="go-icon" src="assets/icons/search.svg" alt="Go" /></button>
    </div>
    <div class="action-group">
      <button id="favorite" class="favorite-btn" aria-label="Favorite">
        <img class="nav-icon favorite-star-outline" src="assets/icons/favorite.svg" alt="Favorite" />
        <img class="nav-icon favorite-star-filled" src="assets/icons/favorited.svg" alt="Favorited" style="display:none" />
      </button>
      <button id="new-window" aria-label="New window"><img class="new-window-icon" src="assets/icons/new-window.svg" alt="New window" /></button>
    </div>
  </header>

  <div class="webview-container" id="webview-container">
    <div id="split-divider" class="split-divider" style="display:none;"></div>
    <div id="home-view" class="home-view">
      <div class="home-container">
        <img class="home-logo" src="assets/icons/alma.svg" alt="Alma" />
        <div class="alma-subtitle">Your personal browser</div>
        <div class="search-box">
          <input type="text" id="home-search" placeholder="Search or type a URL..." spellcheck="false" />
          <button id="home-go" aria-label="Go"><img class="home-go-icon" src="assets/icons/search.svg" alt="Go" /></button>
        </div>
      </div>
    </div>
    <div id="history-view" class="home-view history-view" style="display:none;">
      <div class="history-panel">
        <div class="history-header">
          <div class="alma-subtitle">History</div>
        </div>
        <div id="history-list" class="history-list"></div>
        <div class="history-footer">
          <button id="clear-history" class="settings-btn">Clear history</button>
        </div>
      </div>
    </div>
    <div id="favorites-view" class="home-view history-view" style="display:none;">
      <div class="history-panel">
        <div class="history-header">
          <div class="alma-subtitle">Favorites</div>
        </div>
        <div id="favorites-list-page" class="history-list"></div>
        <div class="history-footer">
          <button id="clear-favorites" class="settings-btn">Clear favorites</button>
        </div>
      </div>
    </div>
  </div>

  <div id="settings-panel" class="settings-panel" style="display:none;">
    <button id="open-history" class="settings-btn">History</button>
    <button id="theme-toggle" class="settings-btn">Themes</button>
    <button id="favorites-toggle" class="settings-btn" data-open-favorites="true"><span id="open-favorites">Favorites</span></button>
    <button id="restore-session" class="settings-btn">Restore session on launch: On</button>
  </div>
  <div id="themes-panel" class="themes-panel" style="display:none;">
    <div class="themes-header">
      <span class="themes-title">Themes</span>
      <button id="close-themes" class="themes-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="themes-section">
      <div class="themes-label">Mode</div>
      <div class="themes-modes">
        <button id="theme-light" class="themes-mode">Light</button>
        <button id="theme-dark" class="themes-mode">Dark</button>
      </div>
    </div>
    <div class="themes-section">
      <div class="themes-label">Accent</div>
      <div class="themes-swatches">
        <button class="themes-swatch" data-color="#8e8e93" style="background:#8e8e93" aria-label="Gray"></button>
        <button class="themes-swatch" data-color="#ff3b30" style="background:#ff3b30" aria-label="Red"></button>
        <button class="themes-swatch" data-color="#34c759" style="background:#34c759" aria-label="Green"></button>
        <button class="themes-swatch" data-color="#ff9500" style="background:#ff9500" aria-label="Orange"></button>
        <button class="themes-swatch" data-color="#af52de" style="background:#af52de" aria-label="Purple"></button>
        <button class="themes-swatch" data-color="#1d1d1f" style="background:#1d1d1f" aria-label="Black"></button>
        <input type="color" id="tint-color" class="themes-color" value="#8e8e93" aria-label="Custom color" />
        <button id="reset-tint" class="themes-icon" aria-label="Reset color"><img src="assets/icons/reload.svg" alt="" /></button>
      </div>
    </div>
    <div class="themes-section">
      <div class="themes-label">Home background</div>
      <div class="themes-row">
        <label class="themes-file">Choose image
          <input type="file" id="bg-image" accept="image/*" hidden />
        </label>
        <button id="clear-bg" class="themes-icon" aria-label="Clear background" style="display:none;"><img src="assets/icons/reload.svg" alt="" /></button>
      </div>
    </div>
  </div>
  <div id="favorites-panel" class="themes-panel" style="display:none;">
    <div class="themes-header">
      <span class="themes-title">Favorites</span>
      <button id="close-favorites" class="themes-close" aria-label="Close">&#10005;</button>
    </div>
    <div id="favorites-list" class="history-list"></div>
    <div style="margin-top:12px;text-align:center;">
      <button id="open-favorites-page" class="settings-btn">Open favorites page</button>
    </div>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
